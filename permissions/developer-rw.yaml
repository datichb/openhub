# Permission base: developer-rw
# Full read/write development permissions with safe git operations.
# Used by: developer, developer-refactor, developer-migrator (+ overrides), test-generator (+ overrides)
question: deny
skill: allow
bash:
  "*": deny
  # Beads CLI
  "bd *": allow
  # Git — lecture
  "git status*": allow
  "git diff*": allow
  "git log*": allow
  "git branch*": allow
  "git show*": allow
  "git rev-parse*": allow
  # Git — écriture sûre (push/merge/rebase absents intentionnellement ;
  # restauration et nettoyage refusés : garde-fou git d'oh). Commit : après
  # le checkpoint qui le déverrouille ; hooks jamais contournés (oh refuse
  # --no-verify, core.hooksPath, GIT_CONFIG_*, écriture dans .git).
  "git add*": allow
  "git commit*": allow
  "git checkout -b *": allow
  "git switch*": allow
  "git pull*": allow
  "git stash list*": allow
  "git stash show*": allow
  "git worktree*": allow
  "git revert*": allow
  # Package managers — dépendances du projet seulement : rien dans les
  # installations du système (pip hors environnement virtuel, npm -g, gem install)
  "npm *": allow
  "npm install -g*": deny
  "npm install --global*": deny
  "npm i -g*": deny
  "npm i --global*": deny
  "npm link*": deny
  "npx *": allow
  "yarn *": allow
  "yarn global *": deny
  "pnpm *": allow
  "pnpm add -g*": deny
  "pnpm add --global*": deny
  "pnpm exec *": allow
  "bun *": allow
  "bun add -g*": deny
  "bun install -g*": deny
  "poetry *": allow
  "uv run *": allow
  "uv sync*": allow
  "uv venv*": allow
  "uv add *": allow
  "uv pip *": allow
  "uv pip * --system*": deny
  "cargo *": allow
  "go *": allow
  "bundle *": allow
  "gem *": deny
  "gem list*": allow
  "gem --version": allow
  "composer *": allow
  # Python — environnement virtuel du projet (.venv, venv) ; pip seulement à
  # l'intérieur ; pip du système en lecture seule
  "python3 -m venv .venv*": allow
  "python3 -m venv venv*": allow
  "python -m venv .venv*": allow
  "python -m venv venv*": allow
  ".venv/bin/*": allow
  "venv/bin/*": allow
  "*--break-system-packages*": deny
  "pip --version": allow
  "pip3 --version": allow
  "pip list*": allow
  "pip3 list*": allow
  "pip show *": allow
  "pip3 show *": allow
  "python3 --version": allow
  "python --version": allow
  # Test runners directs
  "pytest*": allow
  "python -m pytest*": allow
  "python3 -m pytest*": allow
  "python manage.py test*": allow
  "python3 manage.py test*": allow
  "rspec*": allow
  "rake*": allow
  "playwright*": allow
  "dbt *": allow
  # Lint / type-check directs
  "tsc*": allow
  "ruff*": allow
  "mypy*": allow
  "golangci-lint*": allow
  "rubocop*": allow
  "phpstan*": allow
  "phpcs*": allow
  # RTK (wrapper token-optimisé)
  "rtk *": allow
  # Filesystem — lecture
  "ls*": allow
  "tree*": allow
  "find*": allow
  "cat *": allow
  "wc *": allow
  "file *": allow
  # Filesystem — écriture sûre
  "mkdir*": allow
  "cp *": allow
  "mv *": allow
  "rm *": allow
  "touch *": allow
  # Processus
  "pkill*": allow
  "kill *": allow
  # Réseau
  "curl*": allow
  "wget*": allow
  # Docker local
  "docker build*": allow
  "docker run*": allow
  "docker compose*": allow
  "docker exec*": allow
  "docker logs*": allow
  "docker ps*": allow
  "docker stop*": allow
  "docker rm *": allow
  # Divers
  "echo *": allow
  "make*": allow
  "which *": allow
  "printenv*": allow
read: allow
glob: allow
grep: allow
edit: allow
write: allow
task:
  "*": deny
  "documentarian": allow
ctx_search: allow
ctx_execute: allow
ctx_execute_file: allow
ctx_batch_execute: allow
ctx_fetch_and_index: allow
ctx_index: allow
