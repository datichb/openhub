apiVersion: oh/v1
kind: Workflow
id: feature
category: develop
label: { fr: Feature, en: Feature }
description:
  fr: Réaliser une feature de bout en bout (exploration ou planification, design, implémentation, review)
  en: Deliver a feature end to end (exploration or planning, design, implementation, review)
risk: write
entry:
  agent: orchestrator
inputs:
  request:
    type: text
    label: { fr: Demande, en: Request }
    help:
      fr: La feature décrite en langage naturel (ou l'identifiant d'un ticket ou d'une MR GitLab)
      en: The feature in natural language (or the id of a GitLab issue or merge request)
    max_length: 8000
  tickets:
    type: beads-ids
    label: { fr: Tickets existants, en: Existing tickets }
    help:
      fr: Tickets Beads déjà créés à prendre en charge (facultatif)
      en: Beads tickets already created to take on (optional)
    picker: { multi: true }
  method:
    type: enum
    values: [standard, tdd]
    default: standard
    label: { fr: Méthode, en: Method }
    help:
      fr: "tdd : le développeur présente les points d'injection et les tests prévus (cp-seams), écrit d'abord des tests qui échouent, vérifiés par oh (cp-red), puis implémente"
      en: "tdd: the developer presents the seams and the planned tests (cp-seams), writes failing tests first, checked by oh (cp-red), then implements"
prompt:
  template: prompts/feature.md.tmpl
agents:
  orchestrator: { role: workflow, calls: [pathfinder, planner, designer, orchestrator-dev, reviewer] }
  pathfinder: { role: workflow, mode: subagent }
  planner: { role: workflow, mode: subagent }
  designer: { role: workflow, mode: subagent }
  orchestrator-dev: { role: workflow, mode: subagent, after: cp-0 }
  developer: { role: workflow, after: cp-1 }
  reviewer: { role: workflow, mode: subagent }
  documentarian: { role: independent }
checkpoints:
  cp-tickets:
    by: [orchestrator]
    label: { fr: Valider les tickets à créer, en: Approve the tickets to create }
    description:
      fr: Présenter le découpage proposé par l'agent de planning ; les tickets ne sont créés qu'après la validation. Avec des tickets existants seulement, confirmer la liste (aucune création).
      en: Present the breakdown proposed by the planning agent; tickets are only created once approved. With existing tickets only, confirm the list (nothing created).
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [create]
  cp-0:
    by: [orchestrator]
    label: { fr: Valider le plan, en: Approve the plan }
    description:
      fr: Afficher le tableau des tickets (ordre de traitement, agent prévu) et attendre la confirmation avant toute implémentation.
      en: Show the ticket table (processing order, planned agent) and wait for confirmation before any implementation.
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
  cp-spec:
    by: [orchestrator]
    label: { fr: Valider la spec UX/UI, en: Approve the UX/UI spec }
    condition:
      le designer a produit une spécification UX ou UI pour la feature
    mode: { manuel: conditional, semi-auto: conditional, auto: conditional }
  cp-1:
    by: [orchestrator-dev]
    label: { fr: Démarrer le ticket, en: Start the ticket }
    mode: { manuel: pause, semi-auto: auto, auto: auto }
  cp-seams:
    by: [developer]
    method: tdd
    label: { fr: Points d'injection et tests prévus, en: Seams and planned tests }
    description:
      fr: "Méthode TDD, avant d'écrire un test : présenter les points d'injection, les interfaces et les tests prévus (comportement attendu, cas limites). Une fois par ticket."
      en: "TDD method, before writing a test: present the seams, the interfaces and the planned tests (expected behaviour, edge cases). Once per ticket."
    mode: { manuel: pause, semi-auto: pause, auto: auto }
  cp-red:
    by: [developer]
    method: tdd
    label: { fr: Tests en échec, en: Failing tests }
    description:
      fr: "Méthode TDD, tests écrits et avant le code : oh vérifie que les tests échouent pour la bonne raison et que les changements depuis cp-seams sont des tests (et les seules amorces nécessaires). Une fois par ticket."
      en: "TDD method, once the tests are written and before the code: oh checks that the tests fail for the right reason and that the changes since cp-seams are tests (and only the stubs they need). Once per ticket."
    mode: { manuel: auto, semi-auto: auto, auto: auto }
    verify: { from: stack, expect: fail, must_touch_tests: true, outside_tests: warn, since: cp-seams }
  cp-2:
    by: [orchestrator-dev]
    label: { fr: Commit ou correction, en: Commit or fix }
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [commit, close]
    verify: { from: stack, expect: pass }
  cp-3:
    by: [orchestrator-dev]
    label: { fr: Ticket suivant, en: Next ticket }
    mode: { manuel: pause, semi-auto: auto, auto: auto }
  cp-feature:
    by: [orchestrator]
    label: { fr: Récap de la feature, en: Feature recap }
    description:
      fr: Récap global en fin de feature (tickets traités, commits, points ouverts).
      en: Global recap at the end of the feature (processed tickets, commits, open points).
    mode: { manuel: pause, semi-auto: auto, auto: auto }
modes: { default: semi-auto, allowed: [manuel, semi-auto, auto] }
circuit_breaker: { max_consecutive_subagents: 12 }
limits: { max_fix_rounds: 3 }
preconditions:
  project-context:
    label:
      fr: Aucun contexte projet trouvé (docs/wiki/index.md, ONBOARDING.md ou CONVENTIONS.md)
      en: No project context found (docs/wiki/index.md, ONBOARDING.md or CONVENTIONS.md)
    check: { path_exists: [docs/wiki/index.md, ONBOARDING.md, CONVENTIONS.md] }
    suggest: { workflow: onboarding, resume: true }
beads:
  allow: [show, list, ready, search, query, children, comments, count, lint, find-duplicates, status, graph, history, create, update, close, dep, label, duplicate, supersede]
runtime: { default: local, allowed: [local] }
outputs:
  - { id: tickets, type: beads-ids, label: { fr: Tickets de la feature, en: Feature tickets } }
  - { id: branch, type: branch, label: { fr: Branche de travail, en: Working branch } }
