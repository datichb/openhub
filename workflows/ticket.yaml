apiVersion: oh/v1
kind: Workflow
id: ticket
category: develop
label: { fr: Ticket, en: Ticket }
description:
  fr: Implémenter un ou plusieurs tickets Beads déjà détaillés (développement, review, commit)
  en: Implement one or more detailed Beads tickets (development, review, commit)
risk: write
entry:
  agent: orchestrator-dev
inputs:
  ticket:
    type: beads-id
    required: true
    label: { fr: Ticket, en: Ticket }
    help:
      fr: Ticket Beads prêt à implémenter (plusieurs tickets sélectionnés = une session par ticket)
      en: Beads ticket ready to implement (several selected tickets = one session per ticket)
    picker: { filter: ai-delegated, multi: true }
  method:
    type: enum
    values: [standard, tdd]
    default: standard
    label: { fr: Méthode, en: Method }
    help:
      fr: "tdd : le développeur présente les points d'injection et les tests prévus (cp-seams), écrit d'abord des tests qui échouent, vérifiés par oh (cp-red), puis implémente"
      en: "tdd: the developer presents the seams and the planned tests (cp-seams), writes failing tests first, checked by oh (cp-red), then implements"
  instructions:
    type: text
    label: { fr: Consignes, en: Instructions }
    help:
      fr: Précisions facultatives pour cette session
      en: Optional details for this session
    max_length: 4000
prompt:
  template: prompts/ticket.md.tmpl
agents:
  orchestrator-dev: { role: workflow }
  developer: { role: workflow, after: cp-1 }
  reviewer: { role: workflow, mode: subagent }
  documentarian: { role: independent }
checkpoints:
  cp-1:
    by: [orchestrator-dev]
    label: { fr: Démarrer le ticket, en: Start the ticket }
    description:
      fr: Présenter le ticket et l'agent prévu avant de lancer l'implémentation.
      en: Present the ticket and the planned agent before starting the implementation.
    mode: { manuel: pause, semi-auto: auto, auto: auto }
    remote: auto
  cp-seams:
    by: [developer]
    method: tdd
    label: { fr: Points d'injection et tests prévus, en: Seams and planned tests }
    description:
      fr: "Méthode TDD, avant d'écrire un test : présenter les points d'injection, les interfaces et les tests prévus (comportement attendu, cas limites). Une fois par ticket."
      en: "TDD method, before writing a test: present the seams, the interfaces and the planned tests (expected behaviour, edge cases). Once per ticket."
    mode: { manuel: pause, semi-auto: pause, auto: auto }
    remote: auto
  cp-red:
    by: [developer]
    method: tdd
    label: { fr: Tests en échec, en: Failing tests }
    description:
      fr: "Méthode TDD, tests écrits et avant le code : oh vérifie que les tests échouent pour la bonne raison et que les changements depuis cp-seams sont des tests (et les seules amorces nécessaires). Une fois par ticket."
      en: "TDD method, once the tests are written and before the code: oh checks that the tests fail for the right reason and that the changes since cp-seams are tests (and only the stubs they need). Once per ticket."
    mode: { manuel: auto, semi-auto: auto, auto: auto }
    verify: { from: stack, expect: fail, must_touch_tests: true, outside_tests: warn, since: cp-seams }
    remote: auto
  cp-2:
    by: [orchestrator-dev]
    label: { fr: Commit ou correction, en: Commit or fix }
    description:
      fr: Après la review, présenter le résultat et demander s'il faut committer ou corriger.
      en: After the review, present the result and ask whether to commit or fix.
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [commit, close]
    verify: { from: stack, expect: pass }
    remote: defer
  cp-3:
    by: [orchestrator-dev]
    label: { fr: Ticket suivant, en: Next ticket }
    description:
      fr: Passer au ticket suivant ou s'arrêter.
      en: Move on to the next ticket or stop.
    mode: { manuel: pause, semi-auto: auto, auto: auto }
    remote: auto
modes: { default: semi-auto, allowed: [manuel, semi-auto, auto] }
circuit_breaker: { max_consecutive_subagents: 12 }
limits: { max_fix_rounds: 3 }
beads: { allow: [show, list, ready, children, dep, update, close, comments, label] }
runtime: { default: local, allowed: [local, container, remote] }
outputs:
  - { id: branch, type: branch, label: { fr: Branche de travail, en: Working branch } }
  - { id: tickets, type: beads-ids, label: { fr: Tickets traités, en: Processed tickets } }
