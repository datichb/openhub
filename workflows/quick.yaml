apiVersion: oh/v1
kind: Workflow
id: quick
category: develop
label: { fr: Session rapide, en: Quick session }
description:
  fr: Session de développement directe, sans planification ni checkpoint (petites modifications)
  en: Direct development session, without planning or checkpoints (small changes)
risk: write
entry:
  agent: developer
inputs:
  request:
    type: text
    label: { fr: Demande, en: Request }
    help:
      fr: "Ce qu'il faut faire (facultatif : sinon, la session attend ta demande)"
      en: "What to do (optional: otherwise the session waits for your request)"
    max_length: 8000
prompt:
  template: prompts/quick.md.tmpl
agents:
  developer: { role: workflow, mode: primary }
checkpoints:
  cp-commit:
    label: { fr: Commit, en: Commit }
    description:
      fr: Présenter le résumé des changements (fichiers, tests) avant le commit, puis la fermeture du ticket s'il y en a un.
      en: Present the summary of the changes (files, tests) before the commit, then the closing of the ticket if there is one.
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [commit, close]
skills:
  extra:
    - developer/dev-standards-frontend
    - developer/dev-standards-frontend-data
    - developer/dev-standards-frontend-a11y
    - developer/dev-standards-backend
    - developer/dev-standards-api
    - developer/dev-standards-database
    - developer/dev-standards-devops
    - developer/dev-standards-security-hardening
    - developer/dev-standards-refactoring
    - developer/dev-standards-migration
    - developer/dev-standards-testing
    - developer/test-generation
beads:
  allow: [show, list, ready, search, query, children, comments, count, status, graph, history, create, update, close, dep, label]
runtime: { default: local, allowed: [local] }
