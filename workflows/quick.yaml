apiVersion: oh/v1
kind: Workflow
id: quick
category: develop
label: { fr: Session rapide, en: Quick session }
description:
  fr: Session de développement directe, sans planification ni checkpoint (petites modifications)
  en: Direct development session, without planning or checkpoints (small changes)
risk: write
entry:
  agent: developer
inputs:
  request:
    type: text
    label: { fr: Demande, en: Request }
    help:
      fr: "Ce qu'il faut faire (facultatif : sinon, la session attend ta demande)"
      en: "What to do (optional: otherwise the session waits for your request)"
    max_length: 8000
prompt:
  template: prompts/quick.md.tmpl
agents:
  developer: { role: workflow, mode: primary }
checkpoints:
  cp-commit:
    label: { fr: Commit, en: Commit }
    description:
      fr: Présenter le résumé des changements (fichiers, tests) avant le commit.
      en: Present the summary of the changes (files, tests) before the commit.
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [commit]
beads:
  allow: [show, list, ready, search, children, comments, count, status, graph, history, create, update, close, dep, label]
runtime: { default: local, allowed: [local] }
