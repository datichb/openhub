apiVersion: oh/v1
kind: Workflow
id: security-fix
category: quality
label: { fr: Correction de sécurité, en: Security fix }
description:
  fr: Corriger les constats d'un audit de sécurité — choix des constats, correction avec test de non-régression, nouvelle analyse ciblée avant le commit
  en: Fix the findings of a security audit — choice of the findings, fix with a regression test, targeted re-analysis before the commit
risk: write
inputs:
  findings:
    type: text
    # B1: by default, the report of the audit the launch is chained from
    # (--parent, proposed by audit's next:), else of the last audit session
    # of the project; the content of the report, not its id. p6-debts: of a
    # security audit only (from_equals); none: the session asks for them.
    from: session.output(audit.findings)
    from_equals: { type: security }
    label: { fr: Constats, en: Findings }
    help:
      fr: Les constats à traiter (rapport d'audit ou extrait, un constat par entrée avec sa gravité et son emplacement ; par défaut, le rapport du dernier audit de sécurité du projet ; sans audit de sécurité, la session les demande au début)
      en: The findings to handle (audit report or excerpt, one finding per entry with its severity and location; by default, the report of the last security audit of the project; without one, the session asks for them first)
    # A report holds up to 64 KiB.
    max_length: 65536
prompt:
  template: prompts/security-fix.md.tmpl
agents:
  developer: { role: workflow, mode: subagent, after: cp-triage }
  auditor-subagent: { role: workflow, mode: subagent, after: developer }
checkpoints:
  cp-triage:
    by: [conductor]
    label: { fr: Constats à corriger, en: Findings to fix }
    description:
      fr: Présenter les constats reçus, numérotés, avec leur gravité et leur emplacement ; la réponse dit lesquels corriger dans cette session. Une fois validé, chaque constat écarté devient un ticket, avec la raison du tri.
      en: Present the received findings, numbered, with their severity and location; the answer says which ones to fix in this session. Once approved, each finding set aside becomes a ticket, with the reason of the triage.
    mode: { manuel: pause, semi-auto: pause, auto: auto }
    # B1: the tickets of the findings set aside, created by the developer.
    unlocks: [create]
  cp-rescan:
    by: [conductor]
    label: { fr: Nouvelle analyse, en: Re-analysis }
    description:
      fr: Vérifié par oh, sans pause en semi-auto, avant le commit — les tests passent et au moins un test a été écrit ou modifié ; le verdict de l'auditeur sur chaque constat corrigé accompagne le passage, un constat encore présent repart au developer.
      en: Checked by oh, without a pause in semi-auto, before the commit — the tests pass and at least one test was written or changed; the auditor's verdict on each fixed finding goes with it, a finding still present goes back to the developer.
    mode: { manuel: pause, semi-auto: auto, auto: auto }
    verify: { from: stack, expect: pass, must_touch_tests: true }
  cp-2:
    by: [conductor]
    label: { fr: Commit ou correction, en: Commit or fix }
    description:
      fr: Présenter les corrections, leurs tests de non-régression et le verdict de la nouvelle analyse avant le commit.
      en: Present the fixes, their regression tests and the verdict of the re-analysis before the commit.
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [commit]
    verify: { from: stack, expect: pass, must_touch_tests: true }
modes: { default: semi-auto, allowed: [manuel, semi-auto, auto] }
circuit_breaker: { max_consecutive_subagents: 8 }
limits: { max_fix_rounds: 2 }
beads:
  allow: [show, list, ready, search, query, children, comments, count, status, graph, history, create]
runtime: { default: local, allowed: [local] }
# B1: recorded by oh (tickets created through the Beads gateway).
outputs:
  - { id: deferred, type: beads-ids, record: created, label: { fr: Tickets des constats écartés, en: Tickets of the findings set aside } }
