apiVersion: oh/v1
kind: Workflow
id: debug
category: quality
label: { fr: Debug, en: Debug }
description:
  fr: Diagnostiquer un bug ou un problème isolé (rapport de diagnostic, ticket de correction)
  en: Diagnose a bug or an isolated problem (diagnostic report, fix ticket)
risk: write
entry:
  agent: debugger
inputs:
  issue:
    type: text
    label: { fr: Problème, en: Problem }
    help:
      fr: Le problème observé (symptômes, message d'erreur, étapes) ; vide = la session le demande
      en: The observed problem (symptoms, error message, steps); empty = the session asks for it
    max_length: 8000
prompt:
  template: prompts/debug.md.tmpl
agents:
  debugger: { role: workflow, scratch: { readers: [developer] } }
  developer: { role: independent, mode: primary }
  documentarian: { role: independent }
checkpoints:
  cp-ticket:
    by: [debugger]
    label: { fr: Créer le ticket de correction, en: Create the fix ticket }
    description:
      fr: Présenter le diagnostic et le ticket de correction à créer ; le ticket n'est créé qu'après la validation.
      en: Present the diagnosis and the fix ticket to create; the ticket is only created once approved.
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [create]
  cp-commit:
    by: [developer]
    label: { fr: Commit, en: Commit }
    description:
      fr: Présenter le résumé des changements (fichiers, tests) avant le commit, puis la fermeture du ticket s'il y en a un.
      en: Present the summary of the changes (files, tests) before the commit, then the closing of the ticket if there is one.
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [commit, close]
    verify: { from: stack, expect: pass }
beads:
  allow: [show, list, ready, search, query, lint, children, comments, count, status, graph, history, create, update, close, dep, label]
runtime: { default: local, allowed: [local] }
outputs:
  - { id: tickets, type: beads-ids, label: { fr: Tickets de correction, en: Fix tickets } }
