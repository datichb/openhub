apiVersion: oh/v1
kind: Workflow
id: audit
category: quality
label: { fr: Audit, en: Audit }
description:
  fr: Audit du projet (sécurité, performance, architecture, accessibilité, infrastructure, base de données…), sans rien modifier
  en: Project audit (security, performance, architecture, accessibility, infrastructure, database…), without modifying anything
risk: read
entry:
  agent: auditor
inputs:
  type:
    type: enum
    required: true
    values: [security, performance, architecture, accessibility, ecodesign, observability, privacy, infra, database]
    default: security
    label: { fr: Type d'audit, en: Audit type }
  focus:
    type: text
    label: { fr: Périmètre, en: Scope }
    help:
      fr: Modules, fichiers ou questions à cibler (facultatif)
      en: Modules, files or questions to target (optional)
    max_length: 4000
prompt:
  template: prompts/audit.md.tmpl
agents:
  auditor: { role: workflow }
  auditor-subagent: { role: workflow }
beads: { allow: [show, list] }
runtime: { default: local, allowed: [local, remote] }
# B1: recorded by oh, never declared by an agent: the report of the audit
# (the last one deposited) and its type; a security audit proposes
# security-fix, which reads the report from this session (`from:`).
outputs:
  - { id: findings, type: report, record: report, label: { fr: Constats de l'audit, en: Audit findings } }
  - { id: type, type: text, record: input, label: { fr: Type d'audit, en: Audit type } }
next:
  - workflow: security-fix
    when: { outputs: [findings], equals: { type: security } }
    inputs: { findings: session.output(findings) }
