apiVersion: oh/v1
kind: Workflow
id: spec
category: frame
label: { fr: Spécification, en: Specification }
description:
  fr: Comprendre une demande, écrire sa spec dans le wiki (glossaire, critères et points de test) et la découper en tickets Beads, sans l'implémenter
  en: Understand a request, write its spec in the wiki (glossary, criteria and test points) and slice it into Beads tickets, without implementing it
risk: plan
# R5: `oh run cadrage` launches spec (cadrage.yaml removed).
# feature-migration: `oh run feature` launches spec, `oh run feature
# --tickets …` implement-spec (feature.yaml removed).
aliases: [cadrage, feature]
inputs:
  request:
    type: text
    required: true
    label: { fr: Demande, en: Request }
    help:
      fr: La feature à spécifier en langage naturel (ou l'identifiant d'un ticket ou d'une MR GitLab)
      en: The feature to specify in natural language (or the id of a GitLab issue or merge request)
    max_length: 8000
  # feature-migration: not used by spec itself; recorded by oh and passed on
  # to implement-spec by `next:` (oh run feature -i method=tdd).
  method:
    type: enum
    values: [standard, tdd]
    default: standard
    label: { fr: Méthode de l'implémentation, en: Implementation method }
    help:
      fr: "Méthode de l'implémentation proposée ensuite (implement-spec) ; tdd : tests écrits d'abord, vérifiés par oh. La spec elle-même ne change pas."
      en: "Method of the implementation proposed next (implement-spec); tdd: tests written first, checked by oh. The spec itself does not change."
prompt:
  template: prompts/spec.md.tmpl
agents:
  # R5: exploration before the interview when the request compares designs
  # or asks for an analysis of the code (codebase-design), as in cadrage.
  pathfinder: { role: workflow, mode: subagent }
  # E8 (R4): the planner stays read-only, except its spec in the wiki,
  # which oh opens once the understanding is approved (r5-fixes).
  planner: { role: workflow, mode: subagent, writes: ["docs/wiki/specs/**"], writes_after: cp-understanding }
  designer: { role: workflow, mode: subagent }
checkpoints:
  cp-understanding:
    by: [conductor]
    label: { fr: Valider la compréhension, en: Approve the understanding }
    description:
      fr: Présenter la reformulation de la demande par le planner, son vocabulaire et les réponses aux questions, avant l'écriture de la spec.
      en: Present the planner's restatement of the request, its vocabulary and the answers to the questions, before the spec is written.
    mode: { manuel: pause, semi-auto: pause, auto: auto }
  cp-converge:
    by: [conductor]
    # r5-fixes: oh refuses a checkpoint called before the one it waits for.
    after: cp-understanding
    label: { fr: Convergence de la spec et du découpage, en: Spec and breakdown convergence }
    description:
      fr: Vérifié par oh, sans pause, avant de montrer la spec — glossaire, points de test, chaque critère couvert par une tranche du découpage et aucune tranche hors spec ; un écart est rendu au planner.
      en: Checked by oh, without a pause, before the spec is shown — glossary, test points, every criterion covered by a slice of the breakdown and no slice outside the spec; a gap goes back to the planner.
    mode: { manuel: auto, semi-auto: auto, auto: auto }
    verify:
      spec: { paths: ["docs/wiki/specs/**"], breakdown: true }
  cp-spec:
    by: [conductor]
    after: cp-converge
    label: { fr: Valider la spec, en: Approve the spec }
    description:
      fr: oh vérifie la spec écrite sous docs/wiki/specs/ (glossaire, chaque critère avec son point de test, découpage qui les couvre) ; une fois validée, le planner la commite.
      en: oh checks the spec written under docs/wiki/specs/ (glossary, each criterion with its test point, a breakdown that covers them); once approved, the planner commits it.
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [commit]
    verify:
      spec: { paths: ["docs/wiki/specs/**"], breakdown: true }
  cp-tickets:
    by: [conductor]
    after: cp-spec
    label: { fr: Valider le découpage, en: Approve the breakdown }
    description:
      fr: Les tickets (une tranche du découpage chacun) ne sont créés qu'après validation du découpage par l'utilisateur.
      en: Tickets (one slice of the breakdown each) are only created once the user has approved the breakdown.
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [create]
    verify:
      spec: { paths: ["docs/wiki/specs/**"], breakdown: true }
modes: { default: semi-auto, allowed: [manuel, semi-auto, auto] }
circuit_breaker: { max_consecutive_subagents: 12 }
preconditions:
  project-context:
    label:
      fr: Aucun contexte projet trouvé (docs/wiki/index.md, ONBOARDING.md ou CONVENTIONS.md)
      en: No project context found (docs/wiki/index.md, ONBOARDING.md or CONVENTIONS.md)
    check: { path_exists: [docs/wiki/index.md, ONBOARDING.md, CONVENTIONS.md] }
    suggest: { workflow: onboarding, resume: true }
beads:
  allow: [show, list, ready, children, search, query, count, lint, find-duplicates, label, dep, create, update, comments, duplicate, supersede]
runtime: { default: local, allowed: [local] }
# R5: recorded by oh (spec checked at cp-converge and cp-spec, tickets
# created through the Beads gateway), never declared by an agent.
outputs:
  - { id: spec, type: path, record: spec, label: { fr: Spec écrite, en: Written spec } }
  - { id: tickets, type: beads-ids, record: created, label: { fr: Tickets créés, en: Created tickets } }
  - { id: method, type: text, record: input, label: { fr: Méthode de l'implémentation, en: Implementation method } }
next:
  - workflow: implement-spec
    when: { outputs: [tickets] }
    inputs: { tickets: session.output(tickets), spec: session.output(spec), method: session.output(method) }
