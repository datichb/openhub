apiVersion: oh/v1
kind: Workflow
id: sweep
category: develop
label: { fr: Sweep, en: Sweep }
description:
  fr: Atteindre un objectif transverse en le découpant en sous-tâches indépendantes, puis vérifier le résultat
  en: Reach a cross-cutting goal by splitting it into independent subtasks, then verify the result
risk: write
inputs:
  goal:
    type: text
    required: true
    label: { fr: Objectif, en: Goal }
    help:
      fr: "Objectif de haut niveau (ex. : migrer les appels d'API dépréciés vers la v2)"
      en: "High-level goal (e.g. migrate deprecated API calls to v2)"
    max_length: 4000
  strategy:
    type: enum
    values: [llm, manual, by-file, by-package]
    default: llm
    label: { fr: Découpage, en: Decomposition }
    help:
      fr: "llm : analyse de l'objectif ; manual : tâches fournies ; by-file : fichiers des motifs ; by-package : un package par tâche"
      en: "llm: goal analysis; manual: given tasks; by-file: files matching the patterns; by-package: one package per task"
  tasks:
    type: text
    label: { fr: Tâches, en: Tasks }
    help:
      fr: Une tâche par ligne (découpage manual)
      en: One task per line (manual decomposition)
    max_length: 8000
  include:
    type: string
    label: { fr: Inclure, en: Include }
    help:
      fr: Motifs glob à inclure, séparés par des virgules
      en: Glob patterns to include, comma-separated
    max_length: 1000
  exclude:
    type: string
    label: { fr: Exclure, en: Exclude }
    help:
      fr: Motifs glob à exclure, séparés par des virgules
      en: Glob patterns to exclude, comma-separated
    max_length: 1000
  verify:
    type: enum
    values: [none, tests, lint, build, all, custom]
    default: none
    label: { fr: Vérification, en: Verification }
  verify_cmd:
    type: string
    label: { fr: Commande de vérification, en: Verification command }
    help:
      fr: Commande lancée après les tâches (vérification custom)
      en: Command run after the tasks (custom verification)
    max_length: 500
  dry_run:
    type: bool
    default: false
    label: { fr: Plan seulement, en: Plan only }
    help:
      fr: Afficher le découpage sans rien exécuter
      en: Show the decomposition without running anything
  fanout:
    type: bool
    default: false
    label: { fr: Sessions enfants (expérimental), en: Child sessions (experimental) }
    help:
      fr: "Une session enfant par sous-tâche validée à cp-plan, chacune dans son worktree, mergées par oh dans une branche d'intégration et validées ensemble à cp-merge ([fanout] experimental = true)"
      en: "One child session per subtask approved at cp-plan, each in its own worktree, merged by oh into an integration branch and validated together at cp-merge ([fanout] experimental = true)"
prompt:
  template: prompts/sweep.md.tmpl
# sweep-fanout: by default the subtasks run in the session (developer
# after cp-plan, cp-commit). With the input fanout (experimental), each
# subtask oh recorded at cp-plan (tasks:) is a child session sweep-task in
# its own worktree, its task (title, file scope, domain) given by oh; their
# cp-commit is replaced by cp-merge, verified by oh on the integration
# branch (CP-R3, declared here, in the hub layer, only). No ticket.
fanout:
  input: fanout
  source: tasks
  child: sweep-task
  parallel: 3
  merge: cp-merge
  delegates: [cp-commit]
  merger: merge-conflicts
  inputs: [goal, verify, verify_cmd]
  fix: { workflow: quick, input: request }
agents:
  pathfinder: { role: workflow, mode: subagent }
  developer: { role: workflow, after: cp-plan, fanout: never }
  reviewer: { role: workflow, mode: subagent, after: cp-plan }
checkpoints:
  cp-plan:
    by: [conductor]
    label: { fr: Valider le découpage, en: Approve the decomposition }
    description:
      fr: "Passer le découpage dans tasks (une entrée par sous-tâche : titre, description, périmètre de fichiers, domaine du developer, parallélisable ou non) avant toute exécution : oh le vérifie (périmètres du dépôt, disjoints entre sous-tâches parallélisables, et entre toutes en fan-out), le présente et l'enregistre."
      en: "Give the decomposition in tasks (one entry per subtask: title, description, file scope, developer domain, parallel or not) before any execution: oh checks it (scopes of the repository, disjoint between parallel subtasks, and between all of them in a fan-out), shows it and records it."
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    tasks:
      max: 12
      domains: [frontend, backend, fullstack, api, data, mobile, devops, platform, security, refactor, migration, tests]
  cp-commit:
    by: [conductor]
    fanout: never
    label: { fr: Commit du sweep, en: Commit the sweep }
    description:
      fr: Présenter le diff, le résultat de la vérification (PASS ou FAIL ; un summary qui commence par VÉRIFICATION ÉCHOUÉE si elle échoue encore) et la review avant le commit (un commit, ou un par sous-tâche à la suite).
      en: Present the diff, the verification result (PASS or FAIL; a summary starting with VÉRIFICATION ÉCHOUÉE when it still fails) and the review before committing (one commit, or one per subtask in a row).
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [commit]
    verify: { from: stack, expect: pass }
  cp-merge:
    by: [conductor]
    fanout: only
    label: { fr: Valider les merges, en: Approve the merges }
    description:
      fr: "Fan-out : les sessions enfants terminées et mergées par oh dans la branche d'intégration, la revue de l'ensemble faite — présenter le tableau des sous-tâches (état, merge, conflits résolus par le merger) et le verdict de la revue. oh vérifie la branche d'intégration ; validé, oh la merge dans la branche de la session. Remplace le cp-commit de chaque enfant."
      en: "Fan-out: the child sessions done and merged by oh into the integration branch, the review of the whole done — present the table of the subtasks (state, merge, conflicts resolved by the merger) and the verdict of the review. oh verifies the integration branch; once validated, oh merges it into the branch of the session. Replaces the cp-commit of each child."
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [merge]
    verify: { from: stack, expect: pass, on: integration }
  cp-recap:
    by: [conductor]
    label: { fr: Récap du sweep, en: Sweep recap }
    description:
      fr: Résultat par sous-tâche, vérification, review et commits.
      en: Result per subtask, verification, review and commits.
    mode: { manuel: pause, semi-auto: pause, auto: auto }
modes: { default: semi-auto, allowed: [manuel, semi-auto, auto] }
circuit_breaker: { max_consecutive_subagents: 12 }
beads:
  allow: [show, list, search, query]
runtime: { default: local, allowed: [local, container] }
outputs:
  - { id: branch, type: branch, label: { fr: Branche de travail, en: Working branch } }
  - { id: tasks, type: text, record: tasks, label: { fr: Sous-tâches relevées par oh, en: Subtasks recorded by oh } }
