apiVersion: oh/v1
kind: Workflow
id: onboarding
category: knowledge
label: { fr: Onboarding, en: Onboarding }
description:
  fr: Découvrir le projet et créer ou enrichir son wiki documentaire vivant (docs/wiki/)
  en: Discover the project and create or enrich its living documentation wiki (docs/wiki/)
risk: write
entry:
  agent: onboarder
inputs:
  refresh:
    type: bool
    default: false
    label: { fr: Rafraîchir le wiki, en: Refresh the wiki }
    help:
      fr: Re-découvrir le projet et proposer les mises à jour du wiki existant (validées une à une à la carte de cp-wiki), sans rien supprimer
      en: Rediscover the project and propose the updates of the existing wiki (validated one by one on the card of cp-wiki), without deleting anything
  focus:
    type: text
    label: { fr: Points d'attention, en: Focus }
    help:
      fr: Modules ou sujets à approfondir (facultatif)
      en: Modules or topics to dig into (optional)
    max_length: 4000
prompt:
  template: prompts/onboarding.md.tmpl
agents:
  onboarder: { role: workflow, writes: ["docs/wiki/**", ONBOARDING.md, CONVENTIONS.md] }
checkpoints:
  cp-wiki:
    by: [onboarder]
    label: { fr: Commit du wiki, en: Wiki commit }
    description:
      fr: Présenter les pages créées (nouveau wiki) ou les propositions de mise à jour du wiki existant (accepter, modifier, refuser) avant le commit du wiki.
      en: Present the pages created (new wiki) or the proposed updates of the existing wiki (accept, edit, refuse) before the commit of the wiki.
    mandatory: true
    mode: { manuel: pause, semi-auto: pause, auto: pause }
    unlocks: [commit]
    remote: defer
beads:
  allow: [show, list, search, query]
runtime: { default: local, allowed: [local, remote] }
outputs:
  - { id: wiki, type: path, label: { fr: Wiki du projet, en: Project wiki } }
