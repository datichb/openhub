version: 2

project_name: openhub

release:
  github:
    owner: datichb
    name: openhub

before:
  hooks:
    - go mod tidy
    - make sync-content
    - make embed-bd

builds:
  - main: .
    binary: oh
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/datichb/openhub/cli/internal/buildinfo.Version={{.Version}}
      - -X github.com/datichb/openhub/cli/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/datichb/openhub/cli/internal/buildinfo.BuildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - name: openhub
    repository:
      owner: datichb
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/datichb/openhub"
    description: "OpenHub CLI — orchestrateur pour opencode"
    license: "MIT"
    dependencies:
      - name: git
      - name: beads
        type: recommended
    install: |
      bin.install "oh"
    test: |
      system "#{bin}/oh", "version"
