version: 2

project_name: openhub

release:
  github:
    owner: datichb
    name: openhub
  # v5.0.0-rc.N is flagged pre-release: never "latest".
  prerelease: auto

before:
  hooks:
    - go mod tidy
    - make sync-content
    - make embed-bd

builds:
  - main: .
    binary: oh
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/datichb/openhub/cli/internal/buildinfo.Version={{.Version}}
      - -X github.com/datichb/openhub/cli/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/datichb/openhub/cli/internal/buildinfo.BuildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - name: openhub
    repository:
      owner: datichb
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    # A pre-release tag (v5.0.0-rc.N) does not update the Homebrew cask.
    skip_upload: auto
    homepage: "https://github.com/datichb/openhub"
    description: "OpenHub CLI — orchestrateur pour opencode"
    binaries:
      - oh
    # opencode runs every session: without it oh cannot start one. A cask
    # has no "recommended" dependency and no per-OS dependency: beads (bd) and
    # terminal-notifier (clickable notifications, macOS only) are advertised
    # in the caveats instead.
    dependencies:
      - formula: git
      - formula: opencode
    caveats: |
      Outils facultatifs :
        brew install beads              # bd : tableau de tickets
        brew install terminal-notifier  # macOS : notifications cliquables
    # oh is not notarized: without this, Gatekeeper blocks the downloaded
    # binary on macOS ("oh is damaged and cannot be opened"). The cask also
    # installs on Linux (Homebrew 4.5+), where there is no quarantine.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/oh"]
          end
