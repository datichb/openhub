# Capability lint (capability_test.go): what the content may ask although the
# permissions refuse it. Keep it short: fix the content or the permissions
# first. Format "<workflow>/<agent>: <command>" (quoted).
references:
  # Command sheets: they list every bd command, the agent picks what its
  # permissions allow.
  - developer/beads-plan
  - developer/beads-dev
conditional:
  # ÉTAPE 4 invokes the documentarian only when it is in the agent's
  # « Peut déléguer à » column, otherwise the enrichments are listed in the
  # report.
  - shared/living-docs-enrichment
commands:
tasks:
  # orchestrator-dev-protocol (inlined): its invocation table names the
  # documentarian, absent from review-feedback (feedback mode, no
  # CHANGELOG). The lightening phase reworks the protocol.
  - "review-feedback/orchestrator-dev: documentarian"
checkpoints:
  # Ticket path of orchestrator-dev (on-demand skills ticket-workflow,
  # standalone, subagent, parallel: cp-1 → cp-2 → cp-3 of ticket and
  # feature). They ship with the agent in review-feedback, where
  # [MODE:feedback] replaces them with orchestrator-dev-feedback-mode.
  - "review-feedback/orchestrator-dev: cp-1"
  - "review-feedback/orchestrator-dev: cp-3"
claims:
  # Agents whose body says they change no file (of the project code) but
  # write their deliverable (readonly_claims_test.go).
  # « Tu ne modifies jamais le code source » : the benchmark report.
  - "benchmarker: edit reports/benchmarks/*"
  # « à l'exception de » the wiki and the two files the body lists.
  - "onboarder: edit docs/wiki/*"
  - "onboarder: edit ONBOARDING.md"
  - "onboarder: edit CONVENTIONS.md"
