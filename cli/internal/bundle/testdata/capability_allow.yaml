# Capability lint (capability_test.go): what the content may ask although the
# permissions refuse it. Keep it short: fix the content or the permissions
# first. Format "<workflow>/<agent>: <command>" (quoted).
references:
  # Command sheets: they list every bd command, the agent picks what its
  # permissions allow.
  - developer/beads-plan
  - developer/beads-dev
conditional:
commands:
  # R4 (writes:): the planner of spec stages and commits its spec,
  # docs/wiki/specs/<slug>.md (a placeholder here), allowed for that path
  # only (writes_test.go).
  - "spec/planner: git add x"
  - 'spec/planner: git commit -m "x" -- x'
  # onboarding-refresh: the onboarder commits the wiki alone after cp-wiki
  # (writes: docs/wiki/**).
  - "onboarding/onboarder: git add x"
  - 'onboarding/onboarder: git commit -m "x" -- x'
  # R9-a (writes:): the debugger of incident commits its postmortem
  # (docs/wiki/postmortems/), the pathfinder of spike its decision
  # (docs/wiki/decisions/), allowed for that path only.
  - "incident/debugger: git add x"
  - 'incident/debugger: git commit -m "x" -- x'
  - "spike/pathfinder: git add x"
  - 'spike/pathfinder: git commit -m "x" -- x'
  # r9b (writes:): the debugger of retro commits its retrospective
  # (docs/wiki/retros/), allowed for that path only.
  - "retro/debugger: git add x"
  - 'retro/debugger: git commit -m "x" -- x'
tasks:
  # orchestrator-dev-protocol (inlined): its invocation table names the
  # documentarian, absent from review-feedback (feedback mode, no
  # CHANGELOG). The lightening phase reworks the protocol.
  - "review-feedback/orchestrator-dev: documentarian"
  # r9b: the planner of triage launches no agent (its prompt replaces its
  # phases, Figma recon and design delegation included).
  - "triage/planner: designer"
checkpoints:
  # Ticket path of orchestrator-dev (on-demand skills ticket-workflow,
  # standalone, subagent, parallel: cp-1 → cp-2 → cp-3 of ticket and
  # feature). They ship with the agent in review-feedback, where
  # [MODE:feedback] replaces them with orchestrator-dev-feedback-mode.
  - "review-feedback/orchestrator-dev: cp-1"
  - "review-feedback/orchestrator-dev: cp-3"
  # The phase 4-5 and report skills of the debugger name cp-ticket of
  # debug; in incident, the prompt of the session replaces it (block
  # `writes` of the debugger).
  - "incident/debugger: cp-ticket"
  - "retro/debugger: cp-ticket"
claims:
  # Agents whose body says they change no file (of the project code) but
  # write their deliverable (readonly_claims_test.go).
  # « Tu ne modifies jamais le code source » : the benchmark report.
  - "benchmarker: edit reports/benchmarks/*"
  # « à l'exception de » the wiki and the two files the body lists.
  - "onboarder: edit docs/wiki/*"
  - "onboarder: edit ONBOARDING.md"
  - "onboarder: edit CONVENTIONS.md"
