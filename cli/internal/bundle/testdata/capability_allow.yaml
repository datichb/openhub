# Capability lint (capability_test.go): what the content may ask although the
# permissions refuse it. Keep it short: fix the content or the permissions
# first. Format "<workflow>/<agent>: <command>" (quoted).
references:
  # Command sheets: they list every bd command, the agent picks what its
  # permissions allow.
  - developer/beads-plan
  - developer/beads-dev
commands:
tasks: []
checkpoints:
  # Ticket path of orchestrator-dev (on-demand skills ticket-workflow,
  # standalone, subagent, parallel: cp-1 → cp-2 → cp-3 of ticket and
  # feature). They ship with the agent in review-feedback, where
  # [MODE:feedback] replaces them with orchestrator-dev-feedback-mode.
  - "review-feedback/orchestrator-dev: cp-1"
  - "review-feedback/orchestrator-dev: cp-3"
