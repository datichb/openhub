# Generated by oh (oh remote setup) — pipeline schema 3.
# Do not edit: the file is rewritten by `oh remote setup`. Runs only when
# triggered by oh with a session (never on push). Secrets are masked CI
# variables of this project: OH_LLM_KEY, OH_TEAMSTATE_TOKEN, OH_PROJECT_TOKEN_<project id>, scoped to the
# environment of the run job (oh-run/<project id>): the image jobs, which run
# the RUN steps of a project Dockerfile, only hold CI_JOB_TOKEN.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $OH_SESSION_ID'
    - when: never

stages: [prepare, image, run]

default:
  tags: [oh-arm]

variables:
  GIT_STRATEGY: none
  OH_PIPELINE_SCHEMA: "3"

oh-cli:
  stage: prepare
  image: alpine:3.20
  rules:
    - if: '$OH_IMAGE_BUILD == "true"'
  script:
    - |
      set -eu
      mkdir -p oh-layer
      if [ -n "${OH_CLI_URL:-}" ]; then
        wget -q --header "JOB-TOKEN: $CI_JOB_TOKEN" -O oh-layer/oh "$OH_CLI_URL"
        if [ -n "${OH_CLI_SHA256:-}" ]; then echo "$OH_CLI_SHA256  oh-layer/oh" | sha256sum -c -; fi
      else
        base="https://github.com/datichb/openhub/releases/download/v$OH_CLI_VERSION"
        wget -q -O /tmp/openhub_linux_arm64.tar.gz "$base/openhub_linux_arm64.tar.gz"
        wget -q -O /tmp/checksums.txt "$base/checksums.txt"
        (cd /tmp && grep " openhub_linux_arm64.tar.gz\$" checksums.txt | sha256sum -c -)
        tar -xzf /tmp/openhub_linux_arm64.tar.gz -C /tmp oh
        mv /tmp/oh oh-layer/oh
      fi
      chmod 0755 oh-layer/oh
      cp /etc/ssl/certs/ca-certificates.crt oh-layer/ca-certificates.crt
      cat > oh-layer/Dockerfile <<'OH_EOF'
      ARG OH_IMAGE_BASE
      FROM ${OH_IMAGE_BASE}
      ARG OH_TOOL_VERSION
      USER root
      COPY oh /usr/local/bin/oh
      COPY ca-certificates.crt /opt/oh/ca-certificates.crt
      ENV SSL_CERT_FILE=/opt/oh/ca-certificates.crt
      RUN ["/usr/local/bin/oh", "runner", "install"]
      OH_EOF
      cat > oh-layer/Dockerfile.base <<'OH_EOF'
      FROM debian:bookworm-slim
      RUN apt-get update \
       && apt-get install -y --no-install-recommends ca-certificates git ripgrep \
       && rm -rf /var/lib/apt/lists/*
      OH_EOF
  artifacts:
    expire_in: 1 hour
    paths: [oh-layer/]

oh-image:
  stage: image
  needs: [oh-cli]
  rules:
    - if: '$OH_IMAGE_BUILD == "true"'
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - |
      set -eu
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      if [ -n "${OH_DOCKERFILE:-}" ]; then
        wget -q --header "JOB-TOKEN: $CI_JOB_TOKEN" -O /tmp/oh-context.tar.gz "$OH_CONTEXT_URL"
        echo "$OH_CONTEXT_SHA256  /tmp/oh-context.tar.gz" | sha256sum -c -
        docker build -f "$OH_DOCKERFILE" -t "$OH_IMAGE_BASE" - < /tmp/oh-context.tar.gz
      else
        docker build -f oh-layer/Dockerfile.base -t "$OH_IMAGE_BASE" oh-layer
      fi
      docker push "$OH_IMAGE_BASE"
      docker build --build-arg "OH_IMAGE_BASE=$OH_IMAGE_BASE" --build-arg "OH_TOOL_VERSION=$OH_TOOL_VERSION" -t "$OH_IMAGE" oh-layer
      docker push "$OH_IMAGE"

oh-run:
  stage: run
  image:
    name: $OH_IMAGE
    entrypoint: [""]
  needs:
    - job: oh-image
      optional: true
  timeout: 90m
  environment:
    name: oh-run/$OH_PROJECT_ID
    action: prepare
  variables:
    OH_HOME: /tmp/oh
  script:
    - oh runner run --out "$CI_PROJECT_DIR/oh-out"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [oh-out/]
