# Generated by oh (oh remote setup) — pipeline schema 2.
# Do not edit: the file is rewritten by `oh remote setup`. Runs only when
# triggered by oh with a session (never on push). Secrets are masked CI
# variables of this project: OH_LLM_KEY, OH_TEAMSTATE_TOKEN, OH_PROJECT_TOKEN_<project id>.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $OH_SESSION_ID'
    - when: never

stages: [prepare, image, run]

default:
  tags: [oh]

variables:
  GIT_STRATEGY: none
  OH_PIPELINE_SCHEMA: "2"

oh-cli:
  stage: prepare
  image: alpine:3.20
  rules:
    - if: '$OH_IMAGE_BUILD == "true"'
  script:
    - |
      set -eu
      mkdir -p oh-layer
      if [ -n "${OH_CLI_URL:-}" ]; then
        wget -q --header "JOB-TOKEN: $CI_JOB_TOKEN" -O oh-layer/oh "$OH_CLI_URL"
        if [ -n "${OH_CLI_SHA256:-}" ]; then echo "$OH_CLI_SHA256  oh-layer/oh" | sha256sum -c -; fi
      else
        base="https://github.com/datichb/openhub/releases/download/v$OH_CLI_VERSION"
        wget -q -O /tmp/openhub_linux_amd64.tar.gz "$base/openhub_linux_amd64.tar.gz"
        wget -q -O /tmp/checksums.txt "$base/checksums.txt"
        (cd /tmp && grep " openhub_linux_amd64.tar.gz\$" checksums.txt | sha256sum -c -)
        tar -xzf /tmp/openhub_linux_amd64.tar.gz -C /tmp oh
        mv /tmp/oh oh-layer/oh
      fi
      chmod 0755 oh-layer/oh
      cp /etc/ssl/certs/ca-certificates.crt oh-layer/ca-certificates.crt
      cat > oh-layer/Dockerfile <<'OH_EOF'
      ARG OH_IMAGE_BASE
      FROM ${OH_IMAGE_BASE}
      ARG OH_TOOL_VERSION
      USER root
      COPY oh /usr/local/bin/oh
      COPY ca-certificates.crt /opt/oh/ca-certificates.crt
      ENV SSL_CERT_FILE=/opt/oh/ca-certificates.crt
      RUN ["/usr/local/bin/oh", "runner", "install"]
      OH_EOF
      cat > oh-layer/Dockerfile.base <<'OH_EOF'
      FROM debian:bookworm-slim
      RUN apt-get update \
       && apt-get install -y --no-install-recommends ca-certificates git ripgrep \
       && rm -rf /var/lib/apt/lists/*
      OH_EOF
  artifacts:
    expire_in: 1 hour
    paths: [oh-layer/]

oh-image:
  stage: image
  needs: [oh-cli]
  rules:
    - if: '$OH_IMAGE_BUILD == "true"'
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - |
      set -eu
      token_var="OH_PROJECT_TOKEN_${OH_PROJECT_ID}"
      eval "GIT_PASSWORD=\"\${$token_var:-}\""
      if [ -z "$GIT_PASSWORD" ]; then echo "oh: CI variable $token_var is missing (oh remote setup --project)"; exit 1; fi
      export GIT_USERNAME=oauth2 GIT_PASSWORD
      host="${CI_SERVER_FQDN:-$CI_SERVER_HOST}"
      mkdir -p /kaniko/.docker
      auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$auth" > /kaniko/.docker/config.json
      if [ -n "${OH_DOCKERFILE:-}" ]; then
        ctx="git://$host/$OH_PROJECT_PATH.git#refs/heads/$OH_REF"
        if [ -n "${OH_COMMIT:-}" ]; then ctx="$ctx#$OH_COMMIT"; fi
        /kaniko/executor --context "$ctx" --dockerfile "$OH_DOCKERFILE" --destination "$OH_IMAGE_BASE"
      else
        /kaniko/executor --context "dir://$CI_PROJECT_DIR/oh-layer" --dockerfile "$CI_PROJECT_DIR/oh-layer/Dockerfile.base" --destination "$OH_IMAGE_BASE"
      fi
      /kaniko/executor --context "dir://$CI_PROJECT_DIR/oh-layer" --dockerfile "$CI_PROJECT_DIR/oh-layer/Dockerfile" --build-arg "OH_IMAGE_BASE=$OH_IMAGE_BASE" --build-arg "OH_TOOL_VERSION=$OH_TOOL_VERSION" --destination "$OH_IMAGE"

oh-run:
  stage: run
  image:
    name: $OH_IMAGE
    entrypoint: [""]
  needs:
    - job: oh-image
      optional: true
  timeout: 3h
  variables:
    OH_HOME: /tmp/oh
  script:
    - oh runner run --out "$CI_PROJECT_DIR/oh-out"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [oh-out/]
