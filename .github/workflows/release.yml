name: Release — GoReleaser

on:
  # A tag push (v5.0.0, v5.0.0-rc.1…) releases. The former trigger
  # (workflow_run filtered on the main branch) never ran for a tag: the
  # head branch of a tag push is the tag, not main.
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # required for cosign keyless signing via Sigstore OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release oh
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # The toolchain directive of go.mod: one place for the version of Go.
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Prepare embedded hub content
        run: make embed-sync

      - name: Test
        run: go test ./...

      # No release built with a vulnerable standard library or dependency.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Extract the release notes from CHANGELOG.md
        # Fails when the section of the tag is missing. Written in
        # RUNNER_TEMP: goreleaser --clean empties dist/.
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
