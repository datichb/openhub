name: CI — Go CLI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  go-cli:
    name: Go CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: cli/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Prepare embedded hub content
        run: |
          mkdir -p internal/hubcontent/hub
          cp -r ../agents internal/hubcontent/hub/agents
          cp -r ../skills internal/hubcontent/hub/skills
          cp -r ../permissions internal/hubcontent/hub/permissions

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.1
          working-directory: cli

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Test
        run: go test ./... -v -race -count=1

      - name: Coverage
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=60
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" = "1" ]; then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
        shell: bash

      - name: Build
        run: go build -o bin/oh .

  docs-checks:
    name: Documentation checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check changelog freshness
        run: |
          LAST_CHANGELOG=$(git log -1 --format=%H -- CHANGELOG.md)
          if [ -z "$LAST_CHANGELOG" ]; then
            echo "::error::CHANGELOG.md has never been modified"
            exit 1
          fi
          COMMITS_SINCE=$(git rev-list --count "$LAST_CHANGELOG"..HEAD)
          echo "Commits since last CHANGELOG.md update: $COMMITS_SINCE"
          if [ "$COMMITS_SINCE" -gt 50 ]; then
            echo "::error::CHANGELOG.md has not been updated in $COMMITS_SINCE commits (threshold: 50). See ADR-037."
            exit 1
          fi

      - name: Check bilingual parity
        run: |
          ERRORS=0
          for DIR in docs/guides docs/reference docs/architecture/adr; do
            if [ ! -d "$DIR" ]; then
              continue
            fi
            # Check for .fr.md without .en.md
            for FR_FILE in "$DIR"/*.fr.md; do
              [ -f "$FR_FILE" ] || continue
              EN_FILE="${FR_FILE%.fr.md}.en.md"
              if [ ! -f "$EN_FILE" ]; then
                echo "::error file=$FR_FILE::Missing English counterpart: $EN_FILE"
                ERRORS=$((ERRORS + 1))
              fi
            done
            # Check for .en.md without .fr.md
            for EN_FILE in "$DIR"/*.en.md; do
              [ -f "$EN_FILE" ] || continue
              FR_FILE="${EN_FILE%.en.md}.fr.md"
              if [ ! -f "$FR_FILE" ]; then
                echo "::error file=$EN_FILE::Missing French counterpart: $FR_FILE"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS bilingual parity violations. See ADR-037."
            exit 1
          fi
          echo "Bilingual parity check passed."
