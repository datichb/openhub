name: CI — Go CLI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  # The timeout of one `go test` (one shard, see .github/scripts/test-shards.sh).
  # A shard lasts a few minutes (the longest, the Go packages other than ./cmd
  # under -race, about ten at most on a loaded runner): this one only stops a
  # test that hangs, well before the 6 hours of a job.
  GO_TEST_TIMEOUT: 20m

jobs:
  # The static checks of the three systems: they run beside the tests, not
  # after them.
  go-cli-checks:
    name: Go CLI checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Every script below is bash: on Windows the default shell is PowerShell
        # (Git Bash is installed on the runner).
        shell: bash
        working-directory: cli
    steps:
      # The tests expect LF files: the Git for Windows of the runner would check
      # out CRLF (core.autocrlf=true).
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain directive of go.mod: one place for the version of Go.
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Prepare embedded hub content
        run: |
          mkdir -p internal/hubcontent/hub
          cp -r ../agents internal/hubcontent/hub/agents
          cp -r ../skills internal/hubcontent/hub/skills
          cp -r ../permissions internal/hubcontent/hub/permissions
          cp -r ../workflows internal/hubcontent/hub/workflows
          for a in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-s -w" -o internal/runtime/container/assets/bd-linux-$a ./cmd/oh-bd; done

      # Windows only tests the packages of .github/windows-test-packages.txt
      # (the tests of many packages were written for Unix and fail there; the
      # excluded ones, with their cause, are in
      # .github/windows-test-packages-excluded.txt). A package of `go list ./...`
      # that is in neither file, or in both, fails this step: it runs first
      # because it is cheap and the tests depend on it.
      - name: Check the Windows package lists
        if: runner.os == 'Windows'
        run: ../.github/scripts/windows-packages.sh check

      # The tests of ./cmd are split in shards (.github/test-shards-cmd.txt):
      # a test that is in no shard, or in two, would never run, or run twice.
      # The script has its own tests. Once is enough: the same on every system.
      - name: Check the test shards
        if: runner.os == 'Linux'
        run: |
          ../.github/scripts/test-shards-test.sh
          ../.github/scripts/test-shards.sh check

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          working-directory: cli
          args: --build-tags=integration,e2e,container

      - name: Build
        run: go build -o bin/oh .

      # After the checks, and even when they fail: a vulnerability published in
      # the standard library or a dependency must not hide their results. It
      # still fails the job.
      - name: Vulnerability scan
        if: ${{ !cancelled() }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  # The tests, one job per system and shard (.github/scripts/test-shards.sh):
  # four shards of the tests of ./cmd, which run one after the other in their
  # package and lasted 800 s on their own, and three shards of every other
  # package (rest-1 to rest-3; on Windows, the ones of
  # .github/windows-test-packages.txt). ./cmd is not tested on Windows. Only Linux runs under -race (decision of the user: the race
  # detector doubles the time of the tests, and a data race is the same on the
  # three systems) and writes a coverage profile.
  go-cli-test:
    name: Go CLI tests (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [cmd-1, cmd-2, cmd-3, cmd-4, rest-1, rest-2, rest-3]
        exclude:
          - os: windows-latest
            shard: cmd-1
          - os: windows-latest
            shard: cmd-2
          - os: windows-latest
            shard: cmd-3
          - os: windows-latest
            shard: cmd-4
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Prepare embedded hub content
        run: |
          mkdir -p internal/hubcontent/hub
          cp -r ../agents internal/hubcontent/hub/agents
          cp -r ../skills internal/hubcontent/hub/skills
          cp -r ../permissions internal/hubcontent/hub/permissions
          cp -r ../workflows internal/hubcontent/hub/workflows
          for a in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-s -w" -o internal/runtime/container/assets/bd-linux-$a ./cmd/oh-bd; done

      # The tests of the real bd (bdtest.RequireRealBd: contracts of the JSON
      # format, Beads gateway, remote jobs) skip themselves when bd is not on the
      # PATH, so without this step they never ran in the CI. The version is the
      # one oh is written for (bdargs/spec_bd.go, docs/reference/beads-model.*):
      # the release asset of github.com/gastownhall/beads, its SHA-256 checked.
      # To move to another version: regenerate bdargs/spec_bd.go (see
      # beads-model.*), then take the SHA-256 of beads_<version>_linux_amd64.tar.gz
      # from the release page (checksums.txt). Linux only: the tests skip
      # themselves on the other systems.
      - name: Install bd (pinned version, checksum verified)
        if: runner.os == 'Linux'
        env:
          BD_VERSION: "1.3.3"
          BD_SHA256_LINUX_AMD64: "10a7aebfd50549c33c43d185e3870bbd82b4f900b2a5e3129369ee6e2b0fb2e5"
        run: |
          archive="$RUNNER_TEMP/beads-$BD_VERSION.tar.gz"
          bin="$RUNNER_TEMP/bd-bin"
          mkdir -p "$bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/gastownhall/beads/releases/download/v$BD_VERSION/beads_${BD_VERSION}_linux_amd64.tar.gz"
          echo "$BD_SHA256_LINUX_AMD64  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bin" bd
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/bd" version | tee /dev/stderr | grep -F "$BD_VERSION"

      # The profile of the shard: -covermode=atomic, merged with the others by
      # the job "Go CLI coverage" (the threshold is the one of the whole module,
      # so it is checked on the total, not on a shard).
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Not `mapfile` (absent from the bash 3.2 of macOS) nor `< <(…)` (it
          # would hide a failure of the script): a read loop on a variable.
          shard_args="$(../.github/scripts/test-shards.sh args "$SHARD")"
          if [ -z "$shard_args" ]; then
            echo "Nothing to test in $SHARD on $RUNNER_OS (no package of the shard is in .github/windows-test-packages.txt)"
            exit 0
          fi
          args=()
          while IFS= read -r arg; do args+=("$arg"); done <<<"$shard_args"
          flags=(-count=1 -timeout "$GO_TEST_TIMEOUT")
          if [ "$RUNNER_OS" = "Linux" ]; then
            flags+=(-race -coverprofile="coverage-$SHARD.out" -covermode=atomic)
          fi
          echo "Shard $SHARD: ${#args[@]} argument(s) for go test, flags: ${flags[*]}"
          go test "${args[@]}" "${flags[@]}"

      - name: Keep the coverage profile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: cli/coverage-${{ matrix.shard }}.out
          retention-days: 3
          if-no-files-found: error

  # The coverage of the module: the profiles of the Linux shards, merged. Not
  # checked on the other systems: the threshold is the one of the whole module
  # (every package), which only Linux runs; Windows lists packages, and macOS
  # runs without a profile.
  go-cli-coverage:
    name: Go CLI coverage
    runs-on: ubuntu-latest
    needs: go-cli-test
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The sources of the profile are read by `go tool cover`: the hub content
      # that ./internal/hubcontent embeds is not in the repository.
      - name: Prepare embedded hub content
        run: |
          mkdir -p internal/hubcontent/hub
          cp -r ../agents internal/hubcontent/hub/agents
          cp -r ../skills internal/hubcontent/hub/skills
          cp -r ../permissions internal/hubcontent/hub/permissions
          cp -r ../workflows internal/hubcontent/hub/workflows

      - name: Download the coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: ${{ github.workspace }}/cli/coverage-profiles
          merge-multiple: true

      - name: Merge the profiles and check the threshold
        run: |
          ls -l coverage-profiles
          ../.github/scripts/merge-coverage.sh coverage.out coverage-profiles/*.out
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=60
          # awk, not bc: an empty answer would pass.
          if awk -v c="$COVERAGE" -v t="$THRESHOLD" 'BEGIN { exit !(c < t) }'; then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

  # What "Go CLI (<system>)" has always been for a branch protection: one check
  # per system that says whether the Go CLI is green (checks, tests, coverage).
  #
  # The three checks are the same on purpose: the needs.*.result of a matrix job
  # is one result for all its legs, so a failing shard of one system turns the
  # three "Go CLI (<system>)" checks red, not only the one of that system. A
  # per-system result would need the jobs API; it is not worth it, and the names
  # of the checks (the ones of the branch protection) must not change.
  go-cli:
    name: Go CLI (${{ matrix.os }})
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [go-cli-checks, go-cli-test, go-cli-coverage]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checks, tests and coverage passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::the Go CLI is not green: $RESULTS (go-cli-checks go-cli-test go-cli-coverage)"; exit 1; }
          done

  # Integration job: the contract tests (build tag `integration`) against a real
  # `opencode serve` of the pinned version, started without any model.
  #
  # Nothing here calls a model: no model key, no cloud credential and no
  # repository secret is given to this job, and none must be added.
  # On purpose (decision of the user, audit v5 A-06 in docs/dev/audit-v5.md),
  # CI never runs the end-to-end tests that call a real Bedrock model (build tag
  # `e2e`) nor the behaviour evaluations (`make test-eval`): they are local and
  # manual (docs/guides/contributing.*.md). The container runtime tests (build
  # tag `container`) need a container engine and are not run here either.
  go-cli-integration:
    name: Go CLI integration (opencode V2, no LLM)
    runs-on: macos-latest
    env:
      # The only place where the version of opencode is chosen, with its
      # checksums. It must stay in the range of
      # cli/internal/adapters/opencodev2/compatibility.json (2.0.0 to 2.99.99).
      # opencode V2 is published on npm (@opencode/cli-<os>-<arch>), not as GitHub
      # release assets (see linux_binary.go): SHA-256 of the .tgz of the version,
      # for the two macOS architectures. To move to another version: download
      # https://registry.npmjs.org/@opencode/cli-darwin-arm64/-/cli-darwin-arm64-<version>.tgz
      # (and darwin-x64), check it against the `dist.integrity` (sha512) the
      # registry publishes for the version, then record its `shasum -a 256`.
      OPENCODE_VERSION: "2.2.5"
      OPENCODE_SHA256_DARWIN_ARM64: "dfd827de3281b4c3ca2b0bfc8f4beb103fa660c419d148a1a515c4344f9e9c02"
      OPENCODE_SHA256_DARWIN_X64: "304f4666e7e37eac338de258f763b7f5b8987ab1bde2341dc1a613a8205c0010"
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain directive of go.mod: one place for the version of Go.
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install opencode V2 (pinned version, checksum verified)
        run: |
          case "$(uname -m)" in
            arm64) target=darwin-arm64; sha="$OPENCODE_SHA256_DARWIN_ARM64" ;;
            x86_64) target=darwin-x64; sha="$OPENCODE_SHA256_DARWIN_X64" ;;
            *) echo "::error::no opencode checksum for architecture $(uname -m)"; exit 1 ;;
          esac
          bin="$RUNNER_TEMP/opencode-bin"
          mkdir -p "$bin"
          archive="$RUNNER_TEMP/opencode-$target-$OPENCODE_VERSION.tgz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://registry.npmjs.org/@opencode/cli-$target/-/cli-$target-$OPENCODE_VERSION.tgz"
          echo "$sha  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$bin" --strip-components=2 package/bin/opencode
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/opencode" --version | tee /dev/stderr | grep -F "v$OPENCODE_VERSION"

      - name: Prepare embedded hub content
        run: |
          mkdir -p internal/hubcontent/hub
          cp -r ../agents internal/hubcontent/hub/agents
          cp -r ../skills internal/hubcontent/hub/skills
          cp -r ../permissions internal/hubcontent/hub/permissions
          cp -r ../workflows internal/hubcontent/hub/workflows
          for a in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-s -w" -o internal/runtime/container/assets/bd-linux-$a ./cmd/oh-bd; done

      # Only the packages that have integration tests: the other ones have no file
      # in the `integration` tag and run in the "Test and coverage" step of the
      # main job. The list is computed from the files, so that a new package
      # with `//go:build integration` tests joins it with no change here. A
      # constraint that excludes the tag (`!integration || windows`) or that asks
      # for e2e too (`integration && e2e`, never run in CI) does not count.
      #
      # ./cmd is the exception: its 370 unit tests take minutes and run in the
      # main job, so only its tests that build and run the oh binary
      # (cmd/integration_test.go, startup_levels_test.go), named TestBinary*, run
      # here.
      - name: Integration tests (real opencode serve, no model calls)
        run: |
          pkgs=$(grep -rHE --include='*_test.go' '^//go:build ' . |
            awk -F: '{ f = $1; expr = substr($0, length(f) + 2) }
              expr ~ /(^|[^!A-Za-z0-9_])integration([^A-Za-z0-9_]|$)/ && expr !~ /e2e/ { print f }' |
            sed 's#/[^/]*$##' | LC_ALL=C sort -u || true)
          if [ -z "$pkgs" ]; then
            echo "::error::no package has integration tests (//go:build integration)"
            exit 1
          fi
          echo "Packages with integration tests:"
          echo "$pkgs"
          others=$(printf '%s\n' "$pkgs" | grep -vx './cmd' || true)
          # $others unquoted on purpose: one argument per package (no space in the paths).
          if [ -n "$others" ]; then
            go test $others -race -count=1 -tags integration -timeout "$GO_TEST_TIMEOUT"
          fi
          if [ "$others" != "$pkgs" ]; then
            go test ./cmd -race -count=1 -tags integration -run '^TestBinary' -timeout "$GO_TEST_TIMEOUT"
          fi

  # The Mermaid diagrams of the docs render (TestMermaidRenders). The test skips
  # itself when mmdc is missing or cannot start its browser, so that without
  # this job it never ran in the CI: here a skip is a failure. Apart from the
  # main job because it needs Node.js and a headless Chromium (downloaded by
  # the install, about 150 MB), which the three systems of the main job do not
  # need; it runs in parallel with it.
  docs-mermaid:
    name: Mermaid diagrams render
    runs-on: ubuntu-latest
    env:
      # The version the diagrams are checked with. To move to another one, render
      # the diagrams locally with it first (go test ./internal/docstest -run TestMermaidRenders).
      MERMAID_CLI_VERSION: "11.17.0"
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # In a folder of the runner (no sudo, no global install). The Chromium of
      # the runner cannot start its sandbox (user namespaces are restricted on
      # Ubuntu 24.04): mmdc is started through a wrapper, named mmdc and first
      # in the PATH, that gives it a Puppeteer configuration without sandbox
      # (the runner is a throwaway machine, and only the diagrams of the
      # repository are rendered).
      - name: Install mmdc (pinned version)
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/mmdc" "@mermaid-js/mermaid-cli@$MERMAID_CLI_VERSION"
          wrapper="$RUNNER_TEMP/mmdc-wrapper"
          mkdir -p "$wrapper"
          echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer-config.json"
          printf '#!/usr/bin/env bash\nexec "%s/mmdc/node_modules/.bin/mmdc" -p "%s/puppeteer-config.json" "$@"\n' "$RUNNER_TEMP" "$RUNNER_TEMP" > "$wrapper/mmdc"
          chmod +x "$wrapper/mmdc"
          echo "$wrapper" >> "$GITHUB_PATH"
          "$wrapper/mmdc" --version | tee /dev/stderr | grep -F "$MERMAID_CLI_VERSION"

      - name: Render the diagrams
        run: |
          go test ./internal/docstest -run '^TestMermaidRenders$' -count=1 -v -timeout 15m | tee "$RUNNER_TEMP/mermaid.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/mermaid.log"; then
            echo "::error::TestMermaidRenders was skipped: mmdc is not usable on the runner"
            exit 1
          fi

  docs-checks:
    name: Documentation checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changelog freshness
        run: |
          LAST_CHANGELOG=$(git log -1 --format=%H -- CHANGELOG.md)
          if [ -z "$LAST_CHANGELOG" ]; then
            echo "::error::CHANGELOG.md has never been modified"
            exit 1
          fi
          COMMITS_SINCE=$(git rev-list --count "$LAST_CHANGELOG"..HEAD)
          echo "Commits since last CHANGELOG.md update: $COMMITS_SINCE"
          if [ "$COMMITS_SINCE" -gt 50 ]; then
            echo "::error::CHANGELOG.md has not been updated in $COMMITS_SINCE commits (threshold: 50). See ADR-037."
            exit 1
          fi

      - name: Check bilingual parity
        run: |
          ERRORS=0
          for DIR in docs/guides docs/reference docs/architecture/adr; do
            if [ ! -d "$DIR" ]; then
              continue
            fi
            # Check for .fr.md without .en.md
            for FR_FILE in "$DIR"/*.fr.md; do
              [ -f "$FR_FILE" ] || continue
              EN_FILE="${FR_FILE%.fr.md}.en.md"
              if [ ! -f "$EN_FILE" ]; then
                echo "::error file=$FR_FILE::Missing English counterpart: $EN_FILE"
                ERRORS=$((ERRORS + 1))
              fi
            done
            # Check for .en.md without .fr.md
            for EN_FILE in "$DIR"/*.en.md; do
              [ -f "$EN_FILE" ] || continue
              FR_FILE="${EN_FILE%.en.md}.fr.md"
              if [ ! -f "$FR_FILE" ]; then
                echo "::error file=$EN_FILE::Missing French counterpart: $FR_FILE"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS bilingual parity violations. See ADR-037."
            exit 1
          fi
          echo "Bilingual parity check passed."
