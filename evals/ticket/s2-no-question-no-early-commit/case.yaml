id: S2
title: "Ticket : developer et reviewer n'appellent jamais question ; pas de commit avant cp-2"
workflow: ticket
mode: semi-auto
tickets: [ev-1]
beads:
  prefix: ev
  tickets:
    - id: ev-1
      title: "Corriger Sub qui additionne au lieu de soustraire"
      type: bug
      labels: [ai-delegated]
      description: "calc.Sub(a, b) renvoie a + b au lieu de a - b."
      acceptance: "Sub(5, 3) == 2 ; un test TestSub couvre Sub ; go test ./... passe."
timeout: 25m
answers:
  checkpoints:
    "*": approve
  question: first
assertions:
  - type: no_question_in_subagent
    agents: [developer, reviewer]
  - type: ran
    name: aucun commit avant la validation de cp-2
    command: "git commit*"
    absent: true
    before: { checkpoint_passed: cp-2 }
  - type: checkpoint_order
    order: [cp-2]
  - type: ran
    command: "go test*"
    before: { checkpoint: cp-2 }
  - type: changed_within
    paths: ["calc.go", "*_test.go"]
  - type: hidden_tests
  - type: no_denied_loop
