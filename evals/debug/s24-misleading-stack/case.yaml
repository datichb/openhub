id: S24
title: "Debug : la pile pointe sur report/format.go, la cause racine est splitRecord (ledger/parse.go)"
workflow: debug
mode: semi-auto
# Piste trompeuse : le dernier commit ajoute la note au rapport et la panique
# a lieu dans report.noteOf (Fields[3]). La cause racine est en amont :
# ledger.splitRecord découpe avec strings.FieldsFunc, qui supprime les
# champs vides, alors que Entry.Fields promet toujours 4 champs (un libellé
# vide décale aussi le montant). Un garde-fou dans noteOf masquerait le
# symptôme sans corriger la lecture.
setup:
  - |
    cat > report/format.go <<'EOF'
    // Package report met en forme les écritures d'un relevé.
    package report

    import (
    	"fmt"

    	"example.com/releve/ledger"
    )

    // Line renvoie « date | libellé | montant | note » pour une écriture.
    func Line(e ledger.Entry) string {
    	return fmt.Sprintf("%s | %s | %s | %s", e.Date, e.Label, money(e.Cents), noteOf(e))
    }

    func money(cents int64) string {
    	return fmt.Sprintf("%d,%02d €", cents/100, cents%100)
    }

    // noteOf renvoie la note de l'écriture (4e champ, vide si la ligne n'en a pas).
    func noteOf(e ledger.Entry) string {
    	return e.Fields[3]
    }
    EOF
    cat > report/format_test.go <<'EOF'
    package report

    import (
    	"strings"
    	"testing"

    	"example.com/releve/ledger"
    )

    func entries(t *testing.T, in string) []ledger.Entry {
    	t.Helper()
    	es, err := ledger.Parse(strings.NewReader(in))
    	if err != nil {
    		t.Fatal(err)
    	}
    	return es
    }

    func TestLine(t *testing.T) {
    	e := entries(t, "2026-03-01;Boulangerie;4.20;pain\n")[0]
    	if got, want := Line(e), "2026-03-01 | Boulangerie | 4,20 € | pain"; got != want {
    		t.Fatalf("Line = %q, want %q", got, want)
    	}
    }

    func TestLineWithoutNote(t *testing.T) {
    	e := entries(t, "2026-03-02;Café;3.50;\n")[0]
    	if got, want := Line(e), "2026-03-02 | Café | 3,50 € | "; got != want {
    		t.Fatalf("Line = %q, want %q", got, want)
    	}
    }
    EOF
    git add -A && git commit -q -m "feat(report): afficher la note de l'écriture"
text: |
  Depuis le dernier commit (la note dans le rapport), `go test ./...` panique :

      --- FAIL: TestLineWithoutNote (0.00s)
      panic: runtime error: index out of range [3] with length 3 [recovered]
      goroutine 7 [running]:
      example.com/releve/report.noteOf(...)
              report/format.go:21
      example.com/releve/report.Line({{0x1028f0e2a, 0xa}, {0x1028f0e35, 0x5}, 0x15e, {0x14000110180, 0x3, 0x3}})
              report/format.go:12 +0x1c8
      example.com/releve/report.TestLineWithoutNote(0x14000003a00)
              report/format_test.go:28 +0x6c
beads:
  prefix: ev
timeout: 20m
answers:
  question: first
  permission: once
  checkpoints:
    "*": approve
assertions:
  - type: checkpoint_order
    order: [cp-ticket]
  - type: ran
    name: le ticket de correction nomme splitRecord (cause racine)
    command: "bd create*splitRecord*"
  - type: no_denied_loop
