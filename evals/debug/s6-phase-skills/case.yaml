id: S6
title: "Debug : le skill de phase est chargé avant chaque phase"
workflow: debug
mode: semi-auto
text: "go test ./... échoue sur TestSub : Sub(5, 3) renvoie 8 au lieu de 2."
beads:
  prefix: ev
timeout: 20m
answers:
  question: first
  checkpoints:
    "*": approve
# Les phases sont repérées par les titres du debugger (« ## Phase 3 — … ») ;
# une phase qui n'arrive jamais n'exige que le chargement du skill.
assertions:
  - type: skill_loaded_before
    name: debugger-phase-0-1 avant les phases 0 et 1
    skill: debugger-phase-0-1
    before: { text: "#+[^\\n]*Phase [01]\\b", agent: debugger }
  - type: skill_loaded_before
    name: debugger-phase-2-3 avant les phases 2 et 3
    skill: debugger-phase-2-3
    before: { text: "#+[^\\n]*Phase [23]\\b", agent: debugger }
  - type: skill_loaded_before
    name: debugger-phase-4-5 avant les phases 4 et 5
    skill: debugger-phase-4-5
    before: { text: "#+[^\\n]*Phase [45]\\b", agent: debugger }
  - type: skill_loaded_before
    name: debugger-phase-4-5 avant le ticket de correction
    skill: debugger-phase-4-5
    before: { checkpoint: cp-ticket }
  - type: no_denied_loop
