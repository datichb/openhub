id: S14
title: "Libre : l'onboarder lancé en sous-agent ne pose pas de question et rend son enveloppe à orchestrator"
workflow: libre
active: false
inactive_reason: "libre ne rend pas sous-agents les agents qu'il atteint : workflow.SelectEntry (internal/workflow/entry_select.go) ajoute les membres sans mode, l'agent garde mode: primary de son frontmatter et OpenCode refuse task (« Agent onboarder cannot run as a subagent », 3/3 passages le 13/10). À réactiver quand les membres non d'entrée de libre sont en mode subagent."
mode: semi-auto
text: "Lance l'onboarder (outil task) pour découvrir ce projet et créer son wiki documentaire. Ne fais rien d'autre."
timeout: 25m
answers:
  question: first
# L6 cleanup : dans libre, l'onboarder n'est pas l'agent d'entrée ; lancé
# par orchestrator, il enchaîne ses phases sans `question` et adresse son
# retour à l'appelant réel, nommé par le contrat de session.
assertions:
  - type: no_question_in_subagent
    agents: [onboarder]
  - type: text_matches
    name: l'onboarder adresse son retour à orchestrator
    agent: onboarder
    pattern: "Retour vers orchestrator(?:[^-a-z]|$)"
  - type: text_matches
    name: aucun retour adressé à un autre agent
    agent: onboarder
    absent: true
    pattern: "Retour vers (?:conductor|orchestrator-dev|planner)"
  - type: changed_within
    name: écritures limitées au wiki et à ONBOARDING.md
    paths: ["docs/wiki/**", "ONBOARDING.md"]
  - type: no_denied_loop
