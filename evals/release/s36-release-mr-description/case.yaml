id: S36
title: "Release avec MR : la description de la merge request de release est complète (titre, ruptures, vérifications, retour arrière) et donnée à l'utilisateur, faute de branche sur un dépôt distant"
workflow: release
mode: semi-auto
# Branche release/1.3, sans dépôt distant : la MR ne peut pas être ouverte
# (rien n'est poussé). Attendu : la release (v1.3.0 annoté sur HEAD) et,
# dans le rapport, la description complète de la MR et la commande pour
# l'ouvrir après le push.
setup:
  - git tag -a v1.2.0 -m "Release v1.2.0"
  - |
    python3 - <<'PY'
    p = "CHANGELOG.md"
    s = open(p).read()
    s = s.replace("## [Unreleased]\n", "## [Unreleased]\n\n### Added\n\n- Export iCal des événements (`agenda export --ical`).\n", 1)
    open(p, "w").write(s)
    PY
    printf '# export iCal\n' > bin/export.conf
    git add -A && git commit -q -m "feat(export): export iCal des événements"
  - git checkout -q -b release/1.3
# Rapports non enregistrés (reports: off) : la description est dans le
# texte de l'agent, où les assertions la cherchent.
reports: off
inputs:
  mr: true
  target: main
timeout: 15m
answers:
  checkpoints:
    "*": approve
  question: first
assertions:
  - type: checkpoint_order
    order: [cp-release]
  - type: skill_loaded_before
    skill: pr-description
    before: { checkpoint: cp-release }
  - type: ran
    name: aucune MR ouverte sans branche distante (glab)
    command: "glab mr create*"
    absent: true
  - type: ran
    name: aucune PR ouverte sans branche distante (gh)
    command: "gh pr create*"
    absent: true
  - type: ran
    name: aucun push
    command: "git push*"
    absent: true
  - type: text_matches
    name: titre de la MR de release
    pattern: 'chore\(release\)\s*:\s*v?1\.3\.0'
  - type: text_matches
    name: section des ruptures
    pattern: '(rupture|breaking)'
  - type: text_matches
    name: section des vérifications
    pattern: '#+\s*(vérifications?|tests?)\b'
  - type: text_matches
    name: risques et retour arrière
    pattern: '(retour arrière|rollback)'
  - type: text_matches
    name: commande pour ouvrir la MR après le push
    pattern: '(glab mr create|gh pr create)'
  - type: hidden_tests
    name: v1.3.0 annoté sur HEAD, CHANGELOG daté
  - type: no_denied_loop
hidden_tests: "sh check_release.sh 1.3.0 v1.2.0 'ical'"
