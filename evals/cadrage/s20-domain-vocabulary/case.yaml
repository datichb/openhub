id: S20
title: "Cadrage : « réservation » désigne deux choses (prêt et file d'attente) ; l'incohérence est relevée et la spec porte un glossaire"
workflow: cadrage
mode: semi-auto
# Le démon ne garde aucun rapport : le planner inclut son rapport complet
# dans son retour, où l'assertion du glossaire le lit.
reports: off
text: "Limiter à 3 le nombre de réservations en cours par abonné : au-delà, la réservation est refusée avec un message clair."
beads:
  prefix: ev
timeout: 25m
answers:
  question: first
  checkpoints:
    cp-scope: approve
    # La création des tickets n'est pas évaluée ici.
    cp-tickets: "reject: Évaluation terminée : ne crée aucun ticket et termine le workflow."
    "*": approve
# R1-a : dans le code, Reserve crée un prêt (Loan) alors que le type
# Reservation est une file d'attente sur un livre déjà prêté ; l'abonné de la
# demande est l'adhérent (Member) du code, appelé aussi emprunteur
# (BorrowerID). Le cas attend que le double sens de « réservation » soit
# nommé, et que la spec du planner porte un glossaire.
assertions:
  - type: text_matches
    name: le sens de « réservation » (prêt ou file d'attente) est une question posée à l'utilisateur
    agent: conductor
    questions: true
    pattern: "\"question\": ?\"[^\"]*(r[ée]serv[^\"]*(pr[êe]t|emprunt|Loan|file d|Queue)|(pr[êe]t|emprunt|Loan|file d|Queue)[^\"]*r[ée]serv)"
  - type: text_matches
    name: la spec du planner porte un glossaire qui définit « réservation »
    agent: planner
    pattern: "glossaire[\\s\\S]*\\n[^\\n]*r[ée]servation[^\\n]*(pr[êe]t|emprunt|Loan|file|Queue)"
  - type: no_question_in_subagent
    agents: [planner, pathfinder]
  - type: changed_within
    name: aucun fichier modifié
  - type: no_denied_loop
