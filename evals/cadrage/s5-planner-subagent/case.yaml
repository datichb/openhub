id: S5
title: "Cadrage : le planner suit la variante sous-agent (enveloppe vers conductor)"
workflow: cadrage
mode: semi-auto
text: "Ajouter à calc une fonction Mul(a, b int) int, avec son test."
beads:
  prefix: ev
timeout: 25m
answers:
  question: first
  checkpoints:
    cp-scope: approve
    # La création des tickets n'est pas évaluée ici.
    cp-tickets: "reject: Évaluation terminée : ne crée aucun ticket et termine le workflow."
    "*": approve
assertions:
  # Modernisation L5 : planner-execution-modes n'existe plus (protocole
  # d'exécution inclus, variante sous-agent filtrée par le rôle). La variante
  # sous-agent se voit au retour : une enveloppe adressée à l'appelant réel
  # (conductor, nommé par le contrat).
  - type: text_matches
    name: le planner adresse son retour à conductor
    agent: planner
    pattern: "Retour vers conductor"
  - type: no_question_in_subagent
    agents: [planner, pathfinder]
  - type: text_matches
    name: le planner rend un bloc de retour au coordinateur
    agent: planner
    pattern: "Retour (intermédiaire )?vers"
  - type: checkpoint_order
    order: [cp-scope, cp-tickets]
  - type: changed_within
    name: aucun fichier modifié
  - type: no_denied_loop
