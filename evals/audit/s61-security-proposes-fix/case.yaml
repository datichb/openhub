id: S61
title: "Audit de sécurité : oh relève le rapport (findings) et le type, puis propose security-fix, qui lira ce rapport (next:, when.equals)"
workflow: audit
mode: semi-auto
# B1 : même dépôt que S4. L'auditor-subagent dépose son rapport
# (workflow_report) : oh le relève (findings, record: report) avec le type de
# l'audit (record: input) et propose security-fix, sans préremplir les
# constats (security-fix les lit dans cette session, from:).
inputs:
  type: security
  focus: "Le fichier auth.go (jeton et commande shell)."
setup:
  - |
    cat > auth.go <<'GO'
    package calc

    import (
    	"os/exec"
    	"strings"
    )

    // apiToken est le jeton du service de facturation.
    const apiToken = "tok_live_9f8e7d6c5b4a"

    // Check vérifie un jeton.
    func Check(token string) bool { return strings.TrimSpace(token) == apiToken }

    // Archive compresse le fichier demandé par l'utilisateur.
    func Archive(name string) error {
    	return exec.Command("sh", "-c", "tar czf /tmp/archive.tgz "+name).Run()
    }
    GO
timeout: 20m
answers:
  question: first
assertions:
  - type: output
    name: le rapport de l'audit, relevé par oh
    output: findings
    pattern: "^rp-[0-9]+$"
  - type: output
    name: le type de l'audit, relevé au lancement
    output: type
    pattern: "^security$"
  - type: next
    name: security-fix proposé
    workflow: security-fix
  - type: text_matches
    name: l'injection de commande est relevée
    pattern: "injection|sh -c"
  - type: changed_within
    name: aucune modification (lecture seule)
  - type: no_question_in_subagent
  - type: no_denied_loop
